<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 226" width="880" height="226" role="img" aria-label="Kamp Quiz Motoru - konsolda calisan bilgi yarismasi">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: 1px; fill: #e6edf3; }
    .sub   { font-size: 14px; fill: #8b949e; }
    .cmd   { font-size: 15px; fill: #3fb950; }
    .chip  { font-size: 12px; fill: #adbac7; }
    .cursor{ fill: #3fb950; }
  </style>

  <rect x="0.5" y="0.5" width="879" height="225" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- terminal cubugu -->
  <circle cx="28" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="68" cy="24" r="5.5" fill="#28c840"/>
  <text class="mono sub" x="440" y="28" text-anchor="middle" font-size="12">kamp-quiz — bash</text>
  <line x1="1" y1="48" x2="879" y2="48" stroke="#30363d"/>

  <text class="mono title" x="32" y="103">KAMP QUIZ MOTORU</text>
  <text class="mono sub"   x="32" y="128">Terminalde ya da tarayıcıda. Aynı Wi-Fi'daki herkes telefonundan katılır.</text>

  <text class="mono cmd"   x="32" y="162">$ ./run.sh</text>
  <rect class="cursor" x="121" y="150" width="9" height="16" opacity="0.85"/>

  <!-- rozetler -->
  <g class="mono chip">
    <rect x="32"  y="182" width="96"  height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="80"  y="199" text-anchor="middle">81 soru</text>

    <rect x="138" y="182" width="112" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="194" y="199" text-anchor="middle">7 kategori</text>

    <rect x="260" y="182" width="106" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="313" y="199" text-anchor="middle">Java 17+</text>

    <rect x="376" y="182" width="150" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="451" y="199" text-anchor="middle">sıfır bağımlılık</text>

    <rect x="536" y="182" width="164" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="618" y="199" text-anchor="middle">web modu</text>
  </g>

  <!-- sag tarafta mini soru gorseli -->
  <g class="mono" opacity="0.9">
    <rect x="600" y="64" width="248" height="98" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="616" y="86" font-size="11" fill="#8b949e">Soru 3/10   [Ağ Temelleri]</text>
    <text x="616" y="106" font-size="12" fill="#e6edf3">HTTPS hangi portu kullanır?</text>
    <text x="616" y="126" font-size="11" fill="#8b949e">1) 80    2) 443</text>
    <text x="616" y="144" font-size="11" fill="#8b949e">3) 8080  4) 22</text>
    <text x="700" y="144" font-size="11" fill="#3fb950" opacity="0">.</text>
  </g>
</svg>
