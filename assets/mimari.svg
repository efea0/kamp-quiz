<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" aria-label="Proje mimarisi: cli, core ve model katmanlari" role="img" viewBox="0 0 880 390"><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.pkg{font-size:15px;font-weight:700;fill:#e6edf3}.cls{font-size:12px;fill:#adbac7}.cap,.lbl,.note{fill:#8b949e}.lbl,.note{font-size:11px}.cap{font-size:12px}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6e7681" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="879" height="389" x=".5" y=".5" fill="#0d1117" stroke="#30363d" rx="10"/><text x="32" y="34" class="mono note">Oklar bağımlılık yönünü gösterir: üstteki alttakini tanır, altdaki üsttekini tanımaz.</text><rect width="290" height="72" x="32" y="56" fill="#161b22" stroke="#58a6ff" rx="8"/><text x="48" y="82" class="mono pkg">quiz.cli</text><text x="48" y="102" class="mono cls">ConsoleUI</text><text x="48" y="119" class="mono note">ekran + klavye</text><rect width="290" height="72" x="346" y="56" fill="#161b22" stroke="#58a6ff" rx="8"/><text x="362" y="82" class="mono pkg">quiz.web</text><text x="362" y="102" class="mono cls">WebServer · Html · GameSession</text><text x="362" y="119" class="mono note">tarayıcı — telefondan erişilir</text><text x="660" y="98" class="mono lbl">iki arayüz,</text><text x="660" y="114" class="mono lbl">tek motor</text><rect width="604" height="86" x="32" y="176" fill="#161b22" stroke="#3fb950" rx="8"/><text x="48" y="202" class="mono pkg">quiz.core</text><text x="48" y="223" class="mono cls">Quiz soru sırası, karıştırma, skor</text><text x="48" y="241" class="mono cls">QuestionBank .txt paketlerini okur ve doğrular</text><text x="48" y="253" class="mono cls" opacity="0">.</text><text x="48" y="256" class="mono cls">Scoreboard skorları yazar, sıralar</text><rect width="290" height="62" x="32" y="300" fill="#161b22" stroke="#bc8cff" rx="8"/><text x="48" y="326" class="mono pkg">quiz.model</text><text x="48" y="346" class="mono cls">Question — saf veri, kendini korur</text><rect width="176" height="52" x="672" y="176" fill="#161b22" stroke="#30363d" rx="6"/><text x="688" y="198" fill="#e6edf3" class="mono cls">questions/*.txt</text><text x="688" y="215" class="mono note">katkı buraya gelir</text><rect width="176" height="52" x="672" y="244" fill="#161b22" stroke="#30363d" rx="6"/><text x="688" y="266" fill="#e6edf3" class="mono cls">scores.txt</text><text x="688" y="283" class="mono note">lider tablosu</text><line x1="177" x2="177" y1="128" y2="172" stroke="#6e7681" marker-end="url(#arrow)"/><line x1="491" x2="491" y1="128" y2="172" stroke="#6e7681" marker-end="url(#arrow)"/><line x1="177" x2="177" y1="262" y2="296" stroke="#6e7681" marker-end="url(#arrow)"/><line x1="668" x2="640" y1="202" y2="202" stroke="#6e7681" marker-end="url(#arrow)"/><line x1="640" x2="668" y1="252" y2="252" stroke="#6e7681" marker-end="url(#arrow)"/><text x="32" y="380" class="mono cap">quiz.core içinde tek bir System.out.println yoktur — iş mantığı ekranı bilmez.</text></svg>